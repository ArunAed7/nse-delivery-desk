# Amber terminal — ink ground, copper accent
[theme]
base = "dark"
primaryColor = "#E8B86D"
backgroundColor = "#07090C"
secondaryBackgroundColor = "#12161C"
codeBackgroundColor = "#0C1016"
textColor = "#EDE8DF"
linkColor = "#E8B86D"
borderColor = "#2A241C"
codeTextColor = "#C4B8A8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Outfit':https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 14
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#3DDC97"
redColor = "#FF6B7A"
yellowColor = "#E8B86D"
orangeColor = "#F0A05A"
blueColor = "#7DD3FC"
violetColor = "#C4B5FD"
grayColor = "#8A8175"
dataframeBorderColor = "#2A241C"
dataframeHeaderBackgroundColor = "#12161C"

[theme.sidebar]
backgroundColor = "#050608"
secondaryBackgroundColor = "#12161C"
textColor = "#EDE8DF"
borderColor = "#2A241C"
primaryColor = "#E8B86D"

[server]
headless = true
